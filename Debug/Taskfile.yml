---
version: '3'
includes:
  cmake:
    taskfile: "../cmake/" 
    internal: true
    vars:
      preset: "debug-{{.triplet}}"
tasks:
  configure:
    cmds:
    - task: cmake:configure
  build:
    cmds:
    - task: cmake:build
  build:*:
    vars:
      target: "{{ index .MATCH 0 }}"
    cmds:
    - task: cmake:build-target
      vars:
        target: "{{ .target }}"
